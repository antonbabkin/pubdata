collection: cbp
desc: County Business Patterns (CBP)
urls:
  "Home":
    https://www.census.gov/programs-surveys/cbp.html
  "CSV datasets":
    https://www.census.gov/programs-surveys/cbp/data/datasets.html
  "Record Layouts":
    https://www.census.gov/programs-surveys/cbp/technical-documentation/record-layouts.html


# schema blocks
schema:
  core: &schema_core
    naics:
      type: character
      desc: |
        Industry Code - 6-digit NAICS code.
    empflag:
      type: character
      desc: |
        Data Suppression Flag. Denotes an employment size class for data withheld to avoid disclosure (confidentiality) or because data do not meet publication standards.
        A: 0-19
        B: 20-99
        C: 100-249
        E: 250-499
        F: 500-999
        G: 1,000-2,499
        H: 2,500-4,999
        I: 5,000-9,999
        J: 10,000-24,999
        K: 25,000-49,999
        L: 50,000-99,999
        M: 100,000 or More
    emp_nf:
      type: character
      desc: |
        Total Mid-March Employees Noise Flag.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    emp:
      type: integer
      desc: |
        Total Mid-March Employees with Noise.
    qp1_nf:
      type: character
      desc: |
        Total First Quarter Payroll Noise Flag.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    qp1:
      type: double
      desc: |
        Total First Quarter Payroll ($1,000) with Noise.
    ap_nf:
      type: character
      desc: |
        Total Annual Payroll Noise Flag.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    ap:
      type: double
      desc: |
        Total Annual Payroll ($1,000) with Noise.
    est:
      type: integer
      desc: |
        Total Number of Establishments.
  uscode: &schema_uscode
    uscode:
      type: character
      desc: |
        U.S. Geography Indicator = "98"
  st: &schema_st
    fipstate:
      type: character
      desc: |
        FIPS State Code
    censtate:
      type: character
      desc: |
        Census State Code
  co: &schema_co
    fipscty:
      type: character
      desc: |
        FIPS County Code
    cencty:
      type: character
      desc: |
        Census County Code
  lfo: &schema_lfo
    lfo:
      type: character
      desc: |
        Legal Form of Organization.
        -: All Establishments
        C: Corporations
        Z: S-Corporations
        S: Sole Proprietorships
        P: Partnerships
        N: Non-Profits
        G: Government
        O: Other
  size_n: &schema_size_n
    n1_4:
      type: integer
      desc: |
        Number of Establishments: 1-4 Employee Size Class.
    n5_9:
      type: integer
      desc: |
        Number of Establishments: 5-9 Employee Size Class.
    n10_19:
      type: integer
      desc: |
        Number of Establishments: 10-19 Employee Size Class.
    n20_49:
      type: integer
      desc: |
        Number of Establishments: 20-49 Employee Size Class.
    n50_99:
      type: integer
      desc: |
        Number of Establishments: 50-99 Employee Size Class.
    n100_249:
      type: integer
      desc: |
        Number of Establishments: 100-249 Employee Size Class.
    n250_499:
      type: integer
      desc: |
        Number of Establishments: 250-499 Employee Size Class.
    n500_999:
      type: integer
      desc: |
        Number of Establishments: 500-999 Employee Size Class.
    n1000:
      type: integer
      desc: |
        Number of Establishments: 1,000 or More Employee Size Class.
  size_n1000: &schema_size_n1000
    n1000_1:
      type: integer
      desc: |
        Number of Establishments: Employment Size Class: 1,000-1,499 Employees
    n1000_2:
      type: integer
      desc: |
        Number of Establishments: Employment Size Class: 1,500-2,499 Employees
    n1000_3:
      type: integer
      desc: |
        Number of Establishments: Employment Size Class: 2,500-4,999 Employees
    n1000_4:
      type: integer
      desc: |
        Number of Establishments: Employment Size Class: 5,000 or More Employees
  size_eqa: &schema_size_eqa
    f1_4:
      type: character
      desc: |
        Data Suppression Flag: 1-4 Employee Size Class.
    e1_4nf:
      type: character
      desc: |
        Mid-March Employees Noise Flag: 1-4 Employee Size Class.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    e1_4:
      type: integer
      desc: |
        Mid-March Employees with Noise: 1-4 Employee Size Class.
    q1_4nf:
      type: character
      desc: |
        First Quarter Payroll Noise Flag: 1-4 Employee Size Class.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    q1_4:
      type: double
      desc: |
        First Quarter Payroll ($1,000) with Noise: 1-4 Employee Size Class.
    a1_4nf:
      type: character
      desc: |
        Annual Payroll Noise Flag: 1-4 Employee Size Class.
        G: 0 to < 2% noise (low noise)
        H: 2 to < 5% noise (medium noise)
        D: Withheld to avoid disclosing data for individual companies; data are included in higher-level totals. Employment or payroll field set to zero.
        S: Withheld because estimate did not meet publication standards. Employment or payroll field set to zero.
    a1_4:
