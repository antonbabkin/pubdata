data:

  raw_2012_us:
    desc: CBP 2012 U.S. file
    type: raw
    path: raw/2012/cbp2012_us.zip
    url: https://www2.census.gov/programs-surveys/cbp/datasets/2012/cbp12us.zip

  raw_2012_st:
    desc: CBP 2012 state file
    type: raw
    path: raw/2012/cbp2012_st.zip
    url: https://www2.census.gov/programs-surveys/cbp/datasets/2012/cbp12st.zip

  raw_2012_co:
    desc: CBP 2012 county file
    type: raw
    path: raw/2012/cbp2012_co.zip
    url: https://www2.census.gov/programs-surveys/cbp/datasets/2012/cbp12co.zip


  2012_us:
    mask: "{year}_{geo}"
    desc: "CBP {year} U.S. file"
    type: table
    path: "proc/{year}/cbp{year}_us.pq"
    depends: "raw_{year}_us"
    schema:
      <<: [*schema_core, *schema_uscode, *schema_lfo, *schema_size_n, *schema_size_eqa]

  2012_st:
    mask: "{year}_{geo}"
    desc: "CBP {year} state file"
    type: table
    path: "proc/{year}/cbp{year}_st.pq"
    depends: "raw_{year}_st"
    schema:
      <<: [*schema_core, *schema_st, *schema_lfo, *schema_size_n, *schema_size_eqa]

  2012_co:
    mask: "{year}_{geo}"
    desc: "CBP {year} county file"
    type: table
    path: "proc/{year}/cbp{year}_co.pq"
    depends: "raw_{year}_co"
    schema:
      <<: [*schema_core, *schema_st, *schema_co, *schema_size_n, *schema_size_n1000]
